name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'artifacts/provenance.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site-build
          mkdir site-build
          cp site/index.html site-build/index.html
          cp artifacts/provenance.json site-build/provenance.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-build
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
